<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>도파 페어틀 메이커</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://unpkg.com/gifler@0.1.0/gifler.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* 전체 배경: 더 깊은 다크톤으로 고급스럽게 */
    body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #0a0a0a; color: #fff; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; touch-action: none; }
    
    /* 1. 상단 여백 구역 */
    .canvas-section {
      padding: 24px 20px; /* 캔버스 주변에 예쁜 여백 주기 */
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    /* 2. 독립된 뷰파인더 (둥근 모서리 + 16:9 꽉 잡아줌) */
    .canvas-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #15151e;
      border-radius: 16px; /* 둥근 모서리 복구! */
      border: 1px solid #2a2a35; /* 은은한 테두리 */
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }
    
    canvas { display: block; }
    
    .snap-line-v { position: absolute; width: 1.5px; height: 100%; background: #ff4757; left: 50%; top: 0; display: none; pointer-events: none; z-index: 99; }
    .snap-line-h { position: absolute; width: 100%; height: 1.5px; background: #ff4757; top: 50%; left: 0; display: none; pointer-events: none; z-index: 99; }

    /* 3. 하단 서랍 (에셋 라이브러리) */
    .drawer { 
      flex: 1; 
      background-color: #141414; 
      border-radius: 24px 24px 0 0; 
      border-top: 1px solid #222;
      z-index: 10; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
    }
    
    .tab-menu { display: flex; overflow-x: auto; gap: 8px; padding: 20px 20px 10px 20px; flex-shrink: 0; }
    .tab-menu::-webkit-scrollbar { display: none; }
    .tab-btn { background: #222; color: #888; border: 1px solid #333; padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .tab-btn.active { background: #ff4757; color: white; border-color: #ff4757; }
    
    .tab-content { flex: 1; overflow-y: auto; padding: 0 20px 40px 20px; display: none; margin-top: 10px; }
    .tab-content.active { display: block; }
    
    .sub-categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 10px; border-bottom: 1px dashed #333; }
    .sub-categories::-webkit-scrollbar { display: none; }
    .sub-btn { background: #222; color: #ccc; border: none; padding: 8px 14px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .sub-btn.active { background: #444; color: white; }

    .asset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .asset-card { background: #1c1c1c; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #2a2a2a; cursor: pointer; text-align: center; }
    .asset-thumb { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; font-size: 26px; border-radius: 8px; overflow: hidden; background: #111; }
    .asset-thumb img, .asset-thumb svg { width: 90%; height: 90%; object-fit: contain; }
    .asset-title { font-size: 10px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-weight: bold; }

    .btn { color: white; border: none; padding: 16px; border-radius: 14px; font-weight: bold; font-size: 15px; width: 100%; text-align: center; display: block; cursor: pointer; margin-bottom: 12px; box-sizing: border-box; }
    .btn-primary { background: linear-gradient(135deg, #ff6b81, #ff4757); box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3); }
    .btn-frame { background: #4CAF50; }
    .btn-download { background: #fff; color: #000; margin-top: 20px; }
    input[type="file"] { display: none; }

    .text-panel { background: #1c1c1c; padding: 15px; border-radius: 14px; border: 1px solid #2a2a2a; margin-top: 10px; }
    .font-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; }
    .font-scroll::-webkit-scrollbar { display: none; }
    .font-item { width: 45px; height: 45px; background: #222; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; border: 1px solid #333; flex-shrink: 0; font-weight: bold; }
    .font-item.active { border-color: #ff4757; background: #ff475722; color: #ff4757; }
    
    .control-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: #ccc; }
    .control-row input[type="color"] { width: 35px; height: 35px; border: none; border-radius: 6px; cursor: pointer; background: transparent; padding: 0; }
    .control-row input[type="range"] { flex: 1; accent-color: #ff4757; }

    .style-presets { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .style-presets::-webkit-scrollbar { display: none; }
    .preset-btn { background: #222; color: #fff; border: 1px solid #333; padding: 10px 16px; border-radius: 12px; font-size: 12px; cursor: pointer; white-space: nowrap; font-weight: bold; }
  </style>
</head>
<body>

  <!-- ==================== 1. 상단 뷰파인더 캔버스 ==================== -->
  <div class="canvas-section">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="mainCanvas"></canvas>
      <div class="snap-line-v" id="snapV"></div>
      <div class="snap-line-h" id="snapH"></div>
    </div>
  </div>

  <!-- ==================== 2. 하단 서랍 (에셋 라이브러리) ==================== -->
  <div class="drawer">
    <div class="tab-menu">
      <button class="tab-btn active" data-tab="media">📸 배경/사진</button>
      <button class="tab-btn" data-tab="frames">🖼️ 템플릿/틀</button>
      <button class="tab-btn" data-tab="text">🔤 글씨/타이포</button>
      <button class="tab-btn" data-tab="stickers">✨ 꾸미기/저장</button>
    </div>

    <!-- 배경/사진 -->
    <div class="tab-content active" id="media">
      <label class="btn btn-primary">
        ➕ 내 폰에서 사진/GIF 올리기
        <input type="file" id="uploadImage" accept="image/*, image/gif">
      </label>
      <p style="font-size: 12px; color: #666; text-align: center; margin-top: 8px;">16:9 캔버스 뷰파인더 안에 자유롭게 배치해보세요.</p>
    </div>

    <!-- 템플릿/틀 -->
    <div class="tab-content" id="frames">
      <div class="sub-categories">
        <button class="sub-btn active" data-filter="all">전체보기</button>
        <button class="sub-btn" data-filter="royal">👑 로판</button>
        <button class="sub-btn" data-filter="sns">📱 SNS</button>
        <button class="sub-btn" data-filter="fourcut">🎞️ 네컷</button>
      </div>

      <div id="frameActionArea" style="display: none; background: rgba(76, 175, 80, 0.1); padding: 12px; border-radius: 12px; border: 1px dashed #4CAF50; margin-bottom: 12px;">
        <p style="font-size: 12px; color: #4CAF50; margin: 0 0 8px 0; text-align: center; font-weight: bold;">✅ 프레임(틀)이 선택되었습니다!</p>
        <label class="btn btn-frame" style="margin-bottom: 0;">
          🖼️ 이 틀 안에 사진 쏙! 넣기
          <input type="file" id="uploadToFrame" accept="image/*, image/gif">
        </label>
      </div>

      <div class="asset-grid" id="framesGrid"></div>
    </div>

    <!-- 텍스트 -->
    <div class="tab-content" id="text">
      <button class="btn btn-primary" id="addTextBtn">📝 새로운 텍스트 추가</button>
      
      <div class="text-panel" id="textProps" style="display: none;">
        <p style="margin: 0 0 10px 0; font-size: 12px; font-weight: bold; color: #888;">초고속 글씨 스타일 프리셋</p>
        <div class="style-presets">
          <button class="preset-btn" id="presetA" style="background: linear-gradient(135deg, #ff758c, #ff7eb3); border-color: #ff758c;">🌸 애정은 병열</button>
          <button class="preset-btn" id="presetB" style="background: #1a1a1a; color: #ffd700; border-color: #ffd700;">🏯 동양풍 황금빛</button>
          <button class="preset-btn" id="presetC" style="background: #000; color: #00f0ff; border-color: #ff007f;">👾 사이버 네온</button>
        </div>

        <p style="margin: 15px 0 10px 0; font-size: 12px; font-weight: bold; color: #888;">폰트 고르기 (인스타형)</p>
        <div class="font-scroll">
          <div class="font-item active" style="font-family: 'Noto Sans KR';" data-font="Noto Sans KR">가</div>
          <div class="font-item" style="font-family: 'Nanum Myeongjo';" data-font="Nanum Myeongjo">명</div>
          <div class="font-item" style="font-family: 'Black Han Sans';" data-font="Black Han Sans">손</div>
        </div>

        <div class="control-row" style="margin-top: 15px;">
          <span style="width: 50px;">글자색</span>
          <input type="color" id="textColor" value="#ffffff">
        </div>
        
        <div class="control-row">
          <span style="width: 50px;">테두리</span>
          <input type="color" id="strokeColor" value="#ff4757">
          <input type="range" id="strokeWidth" min="0" max="15" value="0">
        </div>

        <div class="control-row">
          <span style="width: 50px;">그림자</span>
          <input type="color" id="shadowColor" value="#ff4757">
          <input type="range" id="shadowBlur" min="0" max="30" value="0">
        </div>
      </div>
    </div>

    <!-- 꾸미기/저장 -->
    <div class="tab-content" id="stickers">
      <p style="font-size: 12px; color: #888; margin: 0 0 10px 0;">✨ 터치해서 스티커 올리기</p>
      <div class="asset-grid" id="stickersGrid" style="margin-bottom: 25px;"></div>

      <p style="font-size: 12px; color: #888; border-top: 1px solid #2a2a2a; padding-top: 15px; margin: 0 0 10px 0;">🎞️ 사진 빠른 필터 (보정)</p>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="background:#222; border: 1px solid #333; font-size: 13px; padding: 12px;" onclick="applyFilter('grayscale')">🎞️ 흑백</button>
        <button class="btn" style="background:#222; border: 1px solid #333; font-size: 13px; padding: 12px;" onclick="applyFilter('sepia')">📜 세피아</button>
        <button class="btn" style="background:#111; border: 1px solid #333; color: #888; font-size: 13px; padding: 12px;" onclick="clearFilters()">🚫 되돌리기</button>
      </div>

      <button class="btn btn-download" id="downloadBtn">💾 완성된 페어틀 고화질(16:9) 저장</button>
    </div>
  </div>

  <!-- ==================== 3. 자바스크립트 ==================== -->
  <script>
    // [ 데이터: 에셋 라이브러리 ]
    const FRAME_ASSETS = [
      { id: 'fourcut_black', category: 'fourcut', title: '🎞️ 인생네컷', svg: `<svg viewBox="0 0 150 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="150" height="400" fill="#151515"/><rect x="10" y="10" width="130" height="80" fill="none" stroke="#555" stroke-width="2" rx="4"/><rect x="10" y="100" width="130" height="80" fill="none" stroke="#555" stroke-width="2" rx="4"/><rect x="10" y="190" width="130" height="80" fill="none" stroke="#555" stroke-width="2" rx="4"/><rect x="10" y="280" width="130" height="80" fill="none" stroke="#555" stroke-width="2" rx="4"/><text x="75" y="380" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">LIFE 4 CUT</text></svg>` },
      { id: 'ticket_vintage', category: 'all', title: '🎟️ 영화 티켓', svg: `<svg viewBox="0 0 240 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="230" height="90" fill="#c0392b" rx="6"/><path d="M 5,40 A 10,10 0 0,0 5,60 L 5,100 L 235,100 L 235,60 A 10,10 0 0,0 235,40 L 235,0 L 5,0 Z" fill="none" stroke="#fff" stroke-dasharray="4" stroke-width="1.5"/><rect x="25" y="15" width="150" height="70" fill="none" stroke="#fff" stroke-width="2"/><text x="100" y="55" fill="#fff" font-size="15" font-family="serif" font-weight="bold" text-anchor="middle">CINEMA TICKET</text></svg>` },
      { id: 'stamp_post', category: 'all', title: '✉️ 빈티지 우표', svg: `<svg viewBox="0 0 120 150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="100" height="130" fill="#f5e6d3" stroke="#8b7355" stroke-width="3"/><path d="M5,5 A 4,4 0 0,1 115,5 A 4,4 0 0,1 115,145 A 4,4 0 0,1 5,145" fill="none" stroke="#f5e6d3" stroke-width="4" stroke-dasharray="10"/><rect x="20" y="20" width="80" height="95" fill="none" stroke="#8b7355" stroke-width="1.5"/></svg>` },
      { id: 'polaroid_instant', category: 'all', title: '📸 폴라로이드', svg: `<svg viewBox="0 0 150 180" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="150" height="180" fill="#ffffff" stroke="#ddd" stroke-width="1.5" rx="2"/><rect x="12" y="12" width="126" height="126" fill="#1a1a1a"/></svg>` },
      { id: 'phone_mockup', category: 'sns', title: '📱 폰 목업', svg: `<svg viewBox="0 0 150 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="145" height="295" x="2.5" y="2.5" fill="none" stroke="#555" stroke-width="5" rx="20"/><rect width="133" height="265" x="8.5" y="15" fill="none" stroke="#333" stroke-width="2"/></svg>` },
      { id: 'gold_frame', category: 'royal', title: '👑 로판 액자', svg: `<svg viewBox="0 0 150 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="140" height="190" fill="none" stroke="#d4af37" stroke-width="8" rx="8"/><rect x="12" y="12" width="126" height="176" fill="none" stroke="#aa7c11" stroke-width="2"/></svg>` }
    ];

    const STICKER_ASSETS = [
      { id: 'st_heart', title: '❤️ 하트', svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M 10,30 A 20,20 0 0,1 50,30 A 20,20 0 0,1 90,30 Q 90,60 50,90 Q 10,60 10,30 Z" fill="#ff4757"/></svg>` },
      { id: 'st_star', title: '⭐️ 별', svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="#ffa502"/></svg>` },
      { id: 'st_sparkle', title: '✨ 반짝이', svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M 50,10 Q 50,50 90,50 Q 50,50 50,90 Q 50,50 10,50 Q 50,50 50,10 Z" fill="#fff"/></svg>` }
    ];

    function renderGrids() {
      const framesGrid = document.getElementById('framesGrid');
      FRAME_ASSETS.forEach(f => {
        const card = document.createElement('div');
        card.className = 'asset-card';
        card.dataset.category = f.category;
        card.innerHTML = `<div class="asset-thumb">${f.svg}</div><div class="asset-title">${f.title}</div>`;
        card.addEventListener('click', () => addSvgToCanvas(f.svg));
        framesGrid.appendChild(card);
      });

      const stickersGrid = document.getElementById('stickersGrid');
      STICKER_ASSETS.forEach(s => {
        const card = document.createElement('div');
        card.className = 'asset-card';
        card.innerHTML = `<div class="asset-thumb">${s.svg}</div><div class="asset-title">${s.title}</div>`;
        card.addEventListener('click', () => addSvgToCanvas(s.svg));
        stickersGrid.appendChild(card);
      });
    }

    document.querySelectorAll('.sub-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('#framesGrid .asset-card').forEach(card => {
          card.style.display = (filter === 'all' || card.dataset.category === filter) ? 'flex' : 'none';
        });
      });
    });

    // [ 뷰파인더 캔버스 세팅 ]
    const BASE_WIDTH = 1280;
    const BASE_HEIGHT = 720;
    const canvas = new fabric.Canvas('mainCanvas', { backgroundColor: 'transparent', preserveObjectStacking: true });

    function resizeCanvas() {
      // 이제 화면 폭이 아니라 '예쁘게 마진이 들어간 뷰파인더 껍데기(wrapper)'의 크기를 기준으로 잡습니다.
      const wrapper = document.getElementById('canvasWrapper');
      const width = wrapper.clientWidth;
      const height = wrapper.clientHeight;
      
      canvas.setWidth(width);
      canvas.setHeight(height);
      
      const scale = width / BASE_WIDTH;
      canvas.setZoom(scale);
      canvas.renderAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 탭 이동
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // SVG 캔버스에 추가
    function addSvgToCanvas(svgString) {
      fabric.loadSVGFromString(svgString, function(objects, options) {
        const obj = fabric.util.groupSVGElements(objects, options);
        obj.scaleToWidth(BASE_WIDTH * 0.25);
        obj.set({
          left: BASE_WIDTH / 2 - (obj.width * obj.scaleX) / 2,
          top: BASE_HEIGHT / 2 - (obj.height * obj.scaleY) / 2
        });
        canvas.add(obj);
        canvas.setActiveObject(obj);
        canvas.renderAll();
      });
    }

    // 업로드 및 스마트 프레임
    function processUpload(file, isFrameInsert = false) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataURL = e.target.result;
        const activeObj = canvas.getActiveObject();

        if (file.type === 'image/gif') {
          gifler(dataURL).frames('canvas', function(ctx, frame) {
            if (!canvas.gifImage) {
              fabric.Image.fromURL(dataURL, function(img) {
                img.set({ left: BASE_WIDTH/2 - img.width/2, top: BASE_HEIGHT/2 - img.height/2 });
                if (isFrameInsert && activeObj) processFrameInsert(img, activeObj);
                else { canvas.add(img); canvas.setActiveObject(img); }
                canvas.gifImage = img; 
              });
            } else {
              canvas.gifImage.setElement(frame.buffer);
              canvas.renderAll();
            }
          });
        } else {
          fabric.Image.fromURL(dataURL, function(img) {
            if(img.width > BASE_WIDTH) img.scaleToWidth(BASE_WIDTH * 0.6);
            img.set({ left: BASE_WIDTH/2 - (img.width * img.scaleX)/2, top: BASE_HEIGHT/2 - (img.height * img.scaleY)/2 });
            if (isFrameInsert && activeObj) processFrameInsert(img, activeObj);
            else { canvas.add(img); canvas.setActiveObject(img); }
          });
        }
      };
      reader.readAsDataURL(file);
    }

    function processFrameInsert(newImg, frameObj) {
      newImg.set({
        left: frameObj.left + 5, top: frameObj.top + 5,
        scaleX: frameObj.scaleX * 0.9, scaleY: frameObj.scaleY * 0.9,
        angle: frameObj.angle
      });
      canvas.add(newImg);
      newImg.sendToBack(); 
      canvas.setActiveObject(newImg);
    }

    document.getElementById('uploadImage').addEventListener('change', (e) => processUpload(e.target.files[0], false));
    document.getElementById('uploadToFrame').addEventListener('change', (e) => processUpload(e.target.files[0], true));

    // 텍스트 로직
    document.getElementById('addTextBtn').addEventListener('click', () => {
      const text = new fabric.IText('더블클릭 수정', {
        left: BASE_WIDTH/2 - 150, top: BASE_HEIGHT/2 - 50, fill: '#ffffff',
        fontFamily: 'Noto Sans KR', fontSize: 60,
        stroke: '#ff4a5a', strokeWidth: 0,
        fontWeight: 'bold',
        shadow: new fabric.Shadow({ color: '#ff4a5a', blur: 0 })
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    });

    function updateTextProperty(key, val) {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') { obj.set(key, val); canvas.renderAll(); }
    }

    document.getElementById('textColor').addEventListener('input', (e) => updateTextProperty('fill', e.target.value));
    document.getElementById('strokeColor').addEventListener('input', updateStroke);
    document.getElementById('strokeWidth').addEventListener('input', updateStroke);
    document.getElementById('shadowColor').addEventListener('input', updateShadow);
    document.getElementById('shadowBlur').addEventListener('input', updateShadow);

    function updateStroke() {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set({ stroke: document.getElementById('strokeColor').value, strokeWidth: parseInt(document.getElementById('strokeWidth').value) });
        canvas.renderAll();
      }
    }
    function updateShadow() {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set('shadow', new fabric.Shadow({ color: document.getElementById('shadowColor').value, blur: parseInt(document.getElementById('shadowBlur').value) }));
        canvas.renderAll();
      }
    }

    document.querySelectorAll('.font-item').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.font-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        updateTextProperty('fontFamily', el.dataset.font);
      });
    });

    document.getElementById('presetA').addEventListener('click', () => applyPreset('#ffffff', '#ff758c', 8, '#ff7eb3', 15));
    document.getElementById('presetB').addEventListener('click', () => applyPreset('#ffd700', '#5c1505', 6, '#8e2b15', 5));
    document.getElementById('presetC').addEventListener('click', () => applyPreset('#00f0ff', '#ff007f', 8, '#ff007f', 20));

    function applyPreset(color, stroke, width, shadowColor, shadowBlur) {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set({ fill: color, stroke: stroke, strokeWidth: width, shadow: new fabric.Shadow({ color: shadowColor, blur: shadowBlur }) });
        canvas.renderAll();
      }
    }

    // 객체 선택 이벤트 & 자석 기능
    canvas.on('selection:created', handleSelection);
    canvas.on('selection:updated', handleSelection);
    canvas.on('selection:cleared', () => {
      document.getElementById('frameActionArea').style.display = 'none';
      document.getElementById('textProps').style.display = 'none';
    });

    function handleSelection(e) {
      const obj = e.selected[0];
      if (obj.type === 'group' || obj.type === 'image') {
        document.getElementById('frameActionArea').style.display = 'block';
        document.getElementById('textProps').style.display = 'none';
      } else if (obj.type === 'i-text') {
        document.getElementById('frameActionArea').style.display = 'none';
        document.getElementById('textProps').style.display = 'block';
      }
    }

    canvas.on('object:moving', function(e) {
      const obj = e.target;
      const centerX = BASE_WIDTH / 2;
      const centerY = BASE_HEIGHT / 2;
      const objCenterX = obj.left + (obj.width * obj.scaleX) / 2;
      const objCenterY = obj.top + (obj.height * obj.scaleY) / 2;

      let snapX = false, snapY = false;
      if (Math.abs(objCenterX - centerX) < 30) {
        obj.set({ left: centerX - (obj.width * obj.scaleX) / 2 }).setCoords();
        snapX = true;
      }
      if (Math.abs(objCenterY - centerY) < 30) {
        obj.set({ top: centerY - (obj.height * obj.scaleY) / 2 }).setCoords();
        snapY = true;
      }

      document.getElementById('snapV').style.display = snapX ? 'block' : 'none';
      document.getElementById('snapH').style.display = snapY ? 'block' : 'none';
    });

    canvas.on('mouse:up', () => {
      document.getElementById('snapV').style.display = 'none';
      document.getElementById('snapH').style.display = 'none';
    });

    // 필터 & 다운로드
    function applyFilter(type) {
      const obj = canvas.getActiveObject();
      if (!obj || obj.type !== 'image') return alert('사진을 먼저 선택해주세요!');
      obj.filters = [];
      if(type==='grayscale') obj.filters.push(new fabric.Image.filters.Grayscale());
      if(type==='sepia') obj.filters.push(new fabric.Image.filters.Sepia());
      obj.applyFilters();
      canvas.renderAll();
    }
    
    function clearFilters() {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'image') { obj.filters = []; obj.applyFilters(); canvas.renderAll(); }
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      canvas.discardActiveObject();
      canvas.renderAll();
      const link = document.createElement('a');
      link.download = `세션카드_${Date.now()}.png`;
      
      // 배경색을 유지하며 원본 비율(1280x720)로 캡처되도록 설정
      const dataUrl = canvas.toDataURL({
        format: 'png',
        multiplier: 1 / canvas.getZoom(),
        backgroundColor: '#15151e'
      });
      
      link.href = dataUrl;
      link.click();
    });

    // 초기화
    renderGrids();
  </script>
</body>
</html>
