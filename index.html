<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>도파 페어틀 메이커</title>
  
  <!-- Fabric.js & Gifler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://unpkg.com/gifler@0.1.0/gifler.min.js"></script>
  
  <!-- 폰트 모음 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ==================== 전체 UI (모바일 최적화) ==================== */
    body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #121212; color: #fff; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; touch-action: none; }
    
    /* 상단 캔버스 영역 (반응형) */
    .canvas-area { flex: 0 0 45vh; width: 100%; display: flex; justify-content: center; align-items: center; background-color: #1a1a1a; position: relative; overflow: hidden; }
    canvas { box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    
    /* 자석 스냅 가이드라인 (중앙선) */
    .snap-line-v { position: absolute; width: 1px; height: 100%; background: #ff4757; left: 50%; top: 0; display: none; pointer-events: none; z-index: 99; }
    .snap-line-h { position: absolute; width: 100%; height: 1px; background: #ff4757; top: 50%; left: 0; display: none; pointer-events: none; z-index: 99; }

    /* 하단 서랍 (에디터) */
    .drawer { flex: 1; background-color: #222; border-radius: 20px 20px 0 0; margin-top: -15px; z-index: 10; display: flex; flex-direction: column; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
    
    /* 탭 메뉴 */
    .tab-menu { display: flex; overflow-x: auto; gap: 8px; padding: 15px; border-bottom: 1px solid #333; flex-shrink: 0; }
    .tab-menu::-webkit-scrollbar { display: none; }
    .tab-btn { background: #333; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .tab-btn.active { background: #ff4757; }
    
    /* 탭 내용 */
    .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; padding-bottom: 30px; }
    .tab-content.active { display: block; }
    
    /* 버튼 컴포넌트 */
    .btn { background: #333; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 14px; width: 100%; text-align: center; display: block; cursor: pointer; margin-bottom: 10px; box-sizing: border-box; }
    .btn-primary { background: #ff4757; }
    .btn-frame { background: #4CAF50; animation: pulse 1.5s infinite; }
    .btn-download { background: #00bcd4; margin-top: 20px; }
    input[type="file"] { display: none; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

    /* 텍스트 에디터 툴바 */
    .text-panel { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #333; }
    .font-scroll { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
    .font-scroll::-webkit-scrollbar { display: none; }
    .font-item { width: 45px; height: 45px; background: #333; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
    .font-item.active { border-color: #ff4757; background: #444; }
    
    .control-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: #ccc; }
    .control-row input[type="color"] { width: 35px; height: 35px; border: none; border-radius: 5px; cursor: pointer; background: transparent; padding: 0; }
    .control-row input[type="range"] { flex: 1; accent-color: #ff4757; }
  </style>
</head>
<body>

  <!-- ==================== 1. 상단 캔버스 ==================== -->
  <div class="canvas-area" id="canvasArea">
    <canvas id="mainCanvas"></canvas>
    <!-- 중앙선 가이드 (자석 기능 시 표시) -->
    <div class="snap-line-v" id="snapV"></div>
    <div class="snap-line-h" id="snapH"></div>
  </div>

  <!-- ==================== 2. 하단 서랍 (에디터) ==================== -->
  <div class="drawer">
    <!-- 탭 네비게이션 -->
    <div class="tab-menu">
      <button class="tab-btn active" data-tab="media">📸 미디어 (사진/틀)</button>
      <button class="tab-btn" data-tab="text">🔤 텍스트 꾸미기</button>
      <button class="tab-btn" data-tab="filter">✨ 필터/저장</button>
    </div>

    <!-- [ 탭 1: 미디어 업로드 ] -->
    <div class="tab-content active" id="media">
      <label class="btn btn-primary">
        ➕ 배경 / 사진 / GIF 추가하기
        <input type="file" id="uploadImage" accept="image/*, image/gif">
      </label>

      <!-- 특정 객체(프레임) 선택 시 나타나는 스마트 마스킹 버튼 -->
      <div id="frameActionArea" style="display: none; margin-top: 15px;">
        <p style="font-size: 12px; color: #4CAF50; margin: 0 0 8px 0; text-align: center;">✅ 템플릿 틀이 선택되었습니다!</p>
        <label class="btn btn-frame">
          🖼️ 이 틀 안으로 사진 쏙! 넣기
          <input type="file" id="uploadToFrame" accept="image/*, image/gif">
        </label>
      </div>
    </div>

    <!-- [ 탭 2: 텍스트 에디터 ] -->
    <div class="tab-content" id="text">
      <button class="btn btn-primary" id="addTextBtn">📝 새로운 텍스트 추가</button>
      
      <!-- 글씨를 선택하면 열리는 상세 설정 패널 -->
      <div class="text-panel" id="textProps" style="display: none;">
        <p style="margin: 0 0 10px 0; font-size: 13px; font-weight: bold; color: #fff;">인스타 폰트 고르기</p>
        <div class="font-scroll">
          <div class="font-item active" style="font-family: 'Noto Sans KR';" data-font="Noto Sans KR">가</div>
          <div class="font-item" style="font-family: 'Nanum Myeongjo';" data-font="Nanum Myeongjo">가</div>
          <div class="font-item" style="font-family: 'Black Han Sans';" data-font="Black Han Sans">가</div>
        </div>

        <div class="control-row">
          <span style="width: 50px;">글자색</span>
          <input type="color" id="textColor" value="#ffffff">
        </div>
        
        <div class="control-row">
          <span style="width: 50px;">테두리</span>
          <input type="color" id="strokeColor" value="#ff4757">
          <input type="range" id="strokeWidth" min="0" max="15" value="0">
        </div>

        <div class="control-row">
          <span style="width: 50px;">그림자</span>
          <input type="color" id="shadowColor" value="#ff4757">
          <input type="range" id="shadowBlur" min="0" max="30" value="0">
        </div>
      </div>
    </div>

    <!-- [ 탭 3: 필터 및 내보내기 ] -->
    <div class="tab-content" id="filter">
      <p style="font-size: 12px; color: #888; text-align: center;">(사진을 선택하고 눌러주세요)</p>
      <button class="btn" style="background:#f39c12;" onclick="applyFilter('grayscale')">🎞️ 흑백 필터 적용</button>
      <button class="btn" style="background:#d35400;" onclick="applyFilter('sepia')">🎞️ 빈티지 세피아 적용</button>
      <button class="btn" style="background:#555;" onclick="clearFilters()">🚫 필터 제거</button>

      <button class="btn btn-download" id="downloadBtn">💾 완성본 PNG 다운로드</button>
    </div>
  </div>

  <!-- ==================== 3. 자바스크립트 풀버전 로직 ==================== -->
  <script>
    // 1. 캔버스 초기화 및 반응형 (모바일 사이즈 맞춤)
    const canvas = new fabric.Canvas('mainCanvas', { 
      backgroundColor: '#111',
      preserveObjectStacking: true // 레이어 순서 꼬임 방지
    });

    function resizeCanvas() {
      const area = document.getElementById('canvasArea');
      // 화면 꽉 차게 하되 16:9 비율 유지
      const width = area.clientWidth;
      const height = area.clientHeight;
      canvas.setWidth(width);
      canvas.setHeight(height);
      canvas.renderAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 2. 탭 메뉴 전환 로직
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // 3. 사진 & GIF 업로드 코어 로직
    function processUpload(file, insertToFrame = false) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataURL = e.target.result;
        const activeObj = canvas.getActiveObject();

        // [GIF 처리]
        if (file.type === 'image/gif') {
          gifler(dataURL).frames('canvas', function(ctx, frame) {
            if (!canvas.gifImage) {
              fabric.Image.fromURL(dataURL, function(img) {
                img.set({ left: canvas.width/2 - img.width/2, top: canvas.height/2 - img.height/2 });
                if (insertToFrame && activeObj) snapToFrame(img, activeObj);
                else { canvas.add(img); canvas.setActiveObject(img); }
                canvas.gifImage = img; 
              });
            } else {
              canvas.gifImage.setElement(frame.buffer);
              canvas.renderAll();
            }
          });
        } 
        // [일반 사진 처리]
        else {
          fabric.Image.fromURL(dataURL, function(img) {
            // 너무 크면 모바일 화면에 맞게 줄임
            if(img.width > canvas.width) img.scaleToWidth(canvas.width * 0.8);
            img.set({ left: canvas.width/2 - (img.width * img.scaleX)/2, top: canvas.height/2 - (img.height * img.scaleY)/2 });
            
            if (insertToFrame && activeObj) snapToFrame(img, activeObj);
            else { canvas.add(img); canvas.setActiveObject(img); }
          });
        }
      };
      reader.readAsDataURL(file);
    }

    // 파일 입력 이벤트 연결
    document.getElementById('uploadImage').addEventListener('change', (e) => processUpload(e.target.files[0], false));
    document.getElementById('uploadToFrame').addEventListener('change', (e) => processUpload(e.target.files[0], true));

    // 4. 스마트 프레임 (사진을 틀 뒤로 쏙 밀어넣기)
    function snapToFrame(photo, frame) {
      photo.set({
        left: frame.left,
        top: frame.top,
        angle: frame.angle,
        scaleX: frame.scaleX,
        scaleY: frame.scaleY
      });
      canvas.add(photo);
      photo.sendToBack(); // 빈 구멍 사이로 보이도록 레이어 맨 밑으로!
      canvas.setActiveObject(photo);
    }

    // 5. 텍스트 추가 & 스타일링 로직
    document.getElementById('addTextBtn').addEventListener('click', () => {
      const txt = new fabric.IText('더블클릭 수정', {
        left: 50, top: 50, fill: '#ffffff',
        fontFamily: 'Noto Sans KR', fontSize: 40,
        stroke: '#ff4757', strokeWidth: 0,
        shadow: new fabric.Shadow({ color: '#ff4757', blur: 0 })
      });
      canvas.add(txt);
      canvas.setActiveObject(txt);
    });

    // 텍스트 속성 업데이트 리스너
    document.getElementById('textColor').addEventListener('input', (e) => updateText('fill', e.target.value));
    document.getElementById('strokeColor').addEventListener('input', (e) => updateTextStroke());
    document.getElementById('strokeWidth').addEventListener('input', (e) => updateTextStroke());
    document.getElementById('shadowColor').addEventListener('input', (e) => updateTextShadow());
    document.getElementById('shadowBlur').addEventListener('input', (e) => updateTextShadow());

    function updateText(key, val) {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') { obj.set(key, val); canvas.renderAll(); }
    }
    function updateTextStroke() {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set({ stroke: document.getElementById('strokeColor').value, strokeWidth: parseInt(document.getElementById('strokeWidth').value) });
        canvas.renderAll();
      }
    }
    function updateTextShadow() {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'i-text') {
        obj.set('shadow', new fabric.Shadow({ color: document.getElementById('shadowColor').value, blur: parseInt(document.getElementById('shadowBlur').value) }));
        canvas.renderAll();
      }
    }

    // 인스타형 폰트 선택
    document.querySelectorAll('.font-item').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.font-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        updateText('fontFamily', el.dataset.font);
      });
    });

    // 6. 객체 선택 시 메뉴 알아서 바뀌는 로직 (UX)
    canvas.on('selection:created', handleSelect);
    canvas.on('selection:updated', handleSelect);
    canvas.on('selection:cleared', () => {
      document.getElementById('frameActionArea').style.display = 'none';
      document.getElementById('textProps').style.display = 'none';
    });

    function handleSelect(e) {
      const obj = e.selected[0];
      if (obj.type === 'image') {
        document.getElementById('frameActionArea').style.display = 'block';
        document.getElementById('textProps').style.display = 'none';
      } else if (obj.type === 'i-text') {
        document.getElementById('frameActionArea').style.display = 'none';
        document.getElementById('textProps').style.display = 'block';
        // 텍스트 메뉴로 탭 자동 전환
        document.querySelector('[data-tab="text"]').click();
      }
    }

    // 7. 🔥 자석 스냅 (Magnetic Snapping) 엔진 🔥
    const snapZone = 15; // 자석이 달라붙는 거리
    canvas.on('object:moving', function(e) {
      const obj = e.target;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const objCenterX = obj.left + (obj.width * obj.scaleX) / 2;
      const objCenterY = obj.top + (obj.height * obj.scaleY) / 2;

      let snapX = false, snapY = false;

      // 가로 중앙 스냅
      if (Math.abs(objCenterX - centerX) < snapZone) {
        obj.set({ left: centerX - (obj.width * obj.scaleX) / 2 }).setCoords();
        snapX = true;
      }
      // 세로 중앙 스냅
      if (Math.abs(objCenterY - centerY) < snapZone) {
        obj.set({ top: centerY - (obj.height * obj.scaleY) / 2 }).setCoords();
        snapY = true;
      }

      // 가이드라인 선 표시/숨김
      document.getElementById('snapV').style.display = snapX ? 'block' : 'none';
      document.getElementById('snapH').style.display = snapY ? 'block' : 'none';
    });

    canvas.on('mouse:up', () => {
      document.getElementById('snapV').style.display = 'none';
      document.getElementById('snapH').style.display = 'none';
    });

    // 8. 사진 필터
    function applyFilter(type) {
      const obj = canvas.getActiveObject();
      if (!obj || obj.type !== 'image') return alert('사진을 먼저 선택하세요!');
      obj.filters = [];
      if(type === 'grayscale') obj.filters.push(new fabric.Image.filters.Grayscale());
      if(type === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
      obj.applyFilters();
      canvas.renderAll();
    }
    function clearFilters() {
      const obj = canvas.getActiveObject();
      if (obj && obj.type === 'image') { obj.filters = []; obj.applyFilters(); canvas.renderAll(); }
    }

    // 9. 다운로드
    document.getElementById('downloadBtn').addEventListener('click', () => {
      canvas.discardActiveObject(); // 선택선(네모칸) 없애기
      canvas.renderAll();
      const link = document.createElement('a');
      link.download = `도파메이커_${Date.now()}.png`;
      link.href = canvas.toDataURL({ format: 'png', quality: 1.0 });
      link.click();
    });
  </script>
</body>
</html>
