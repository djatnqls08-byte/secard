<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOPA 템플릿 메이커 (배경+자동완성)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <!-- 테마용 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&family=Share+Tech+Mono&family=Nanum+Myeongjo:wght@700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #09090b; color: #fff; }
    ::-webkit-scrollbar { display: none; }
    .canvas-wrapper { width: 100%; aspect-ratio: 16/9; background: #111; border-radius: 12px; border: 1px solid #27272a; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    canvas { display: block; }
    
    .theme-btn { padding: 12px; border-radius: 12px; border: 1px solid #27272a; background: #18181b; color: #a1a1aa; font-weight: bold; font-size: 12px; text-align: center; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .theme-btn.active { border-color: #f43f5e; background: #f43f5e20; color: #f43f5e; }

    .input-group label { display: block; font-size: 11px; color: #a1a1aa; font-weight: bold; margin-bottom: 4px; }
    .input-box { width: 100%; background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 12px; border-radius: 8px; font-size: 13px; outline: none; transition: 0.2s; }
    .input-box:focus { border-color: #f43f5e; }
  </style>
</head>
<body class="pb-10">

  <!-- 상단 헤더 -->
  <header class="p-4 border-b border-zinc-800 flex justify-between items-center sticky top-0 bg-[#09090b]/90 backdrop-blur z-50">
    <div class="font-black tracking-widest text-lg text-rose-500">DOPA</div>
    <div class="text-[10px] text-zinc-500 font-mono border border-zinc-700 px-2 py-1 rounded">TEMPLATE MAKER</div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- 1. 미리보기 캔버스 (뷰파인더) -->
    <div>
      <div class="flex justify-between items-end mb-2">
        <span class="text-sm font-bold text-zinc-300">PREVIEW</span>
        <span class="text-[10px] text-emerald-400 font-mono">드래그하여 배경 위치 조절</span>
      </div>
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>

    <!-- 2. 테마 선택 -->
    <div>
      <span class="text-sm font-bold text-zinc-300 block mb-3">1. STYLE (장르 선택)</span>
      <div class="grid grid-cols-3 gap-2">
        <button class="theme-btn active" data-theme="secret">🕵️ 기밀문서</button>
        <button class="theme-btn" data-theme="digicam">📷 디카/HUD</button>
        <button class="theme-btn" data-theme="romance">💗 로맨스</button>
        <button class="theme-btn" data-theme="royal">🏰 로판</button>
        <button class="theme-btn" data-theme="insta">📱 인스타그램</button>
      </div>
    </div>

    <!-- 3. 정보 및 배경 입력 -->
    <div class="space-y-4 bg-zinc-900 p-4 rounded-xl border border-zinc-800">
      <span class="text-sm font-bold text-zinc-300 block mb-2">2. INFORMATION (정보 입력)</span>
      
      <label class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold p-3 rounded-lg text-center block cursor-pointer transition mb-4">
        📸 배경 일러스트 업로드
        <input type="file" id="imageUpload" accept="image/*" class="hidden">
      </label>

      <div class="input-group">
        <label>시나리오 제목 (Title)</label>
        <input type="text" id="valTitle" class="input-box" value="애정은 병열" placeholder="시나리오 제목">
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div class="input-group">
          <label>캐릭터 A</label>
          <input type="text" id="valNameA" class="input-box" value="윤세라" placeholder="이름 1">
        </div>
        <div class="input-group">
          <label>캐릭터 B</label>
          <input type="text" id="valNameB" class="input-box" value="백우진" placeholder="이름 2">
        </div>
      </div>

      <div class="input-group">
        <label>한줄 대사 / 캐치프레이즈</label>
        <input type="text" id="valQuote" class="input-box" value="우리가 다시 만날 수 있을까?" placeholder="명대사 입력">
      </div>
    </div>

    <!-- 4. 내보내기 -->
    <button id="btnDownload" class="bg-white hover:bg-zinc-200 text-black font-bold py-4 rounded-xl text-sm transition active:scale-95 w-full">
      💾 완성본 저장 (1280x720)
    </button>

  </main>

  <script>
    // ==========================================
    // 앱 상태 (State)
    // ==========================================
    const state = {
      theme: 'secret',
      title: '애정은 병열',
      nameA: '윤세라',
      nameB: '백우진',
      quote: '우리가 다시 만날 수 있을까?',
      bgImageObj: null // 업로드된 배경 이미지
    };

    // ==========================================
    // 캔버스 초기화
    // ==========================================
    const BASE_W = 1280;
    const BASE_H = 720;
    const canvas = new fabric.Canvas('mainCanvas', { width: BASE_W, height: BASE_H, selection: false });

    function resizeCanvas() {
      const wrapper = document.getElementById('canvasWrapper');
      canvas.setZoom(wrapper.clientWidth / BASE_W);
      canvas.setWidth(wrapper.clientWidth);
      canvas.setHeight(wrapper.clientWidth * (9/16));
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ==========================================
    // 자동 생성 렌더링 엔진 (핵심)
    // ==========================================
    function renderTemplate() {
      canvas.clear();
      canvas.backgroundColor = '#111';

      // 1. 배경 이미지 렌더링 (가장 먼저 깔림, 선택/이동 가능)
      if (state.bgImageObj) {
        canvas.add(state.bgImageObj);
      }

      // 2. 테마별 오버레이(프레임+텍스트) 렌더링
      const cx = BASE_W / 2;
      const cy = BASE_H / 2;
      const commonTextOpts = { selectable: false, evented: false }; // 사용자가 건드리지 못하게 고정!

      switch (state.theme) {
        // 🕵️ 기밀문서 (캡처 이미지 기반)
        case 'secret':
          // 빨간 점선 테두리
          canvas.add(new fabric.Rect({ left: 40, top: 40, width: 1200, height: 640, fill: 'transparent', stroke: '#e11d48', strokeWidth: 6, strokeDashArray: [15, 15], selectable: false, evented: false }));
          canvas.add(new fabric.Text('TOP SECRET // CONFIDENTIAL', { left: 80, top: 80, fontFamily: 'Share Tech Mono', fontSize: 35, fontWeight: 'bold', fill: '#e11d48', ...commonTextOpts }));
          
          canvas.add(new fabric.Text(state.title, { left: 80, top: 160, fontFamily: 'Noto Sans KR', fontSize: 80, fontWeight: '900', fill: '#fff', shadow: new fabric.Shadow({ color: '#000', blur: 10 }), ...commonTextOpts }));
          canvas.add(new fabric.Text(`SUBJECT: ${state.nameA} x ${state.nameB}`, { left: 85, top: 270, fontFamily: 'Share Tech Mono', fontSize: 24, fill: '#fca5a5', backgroundColor: 'rgba(0,0,0,0.5)', ...commonTextOpts }));
          canvas.add(new fabric.Text(`"${state.quote}"`, { left: 85, top: 600, fontFamily: 'Gowun Batang', fontSize: 28, fill: '#fff', shadow: new fabric.Shadow({ color: '#000', blur: 4 }), ...commonTextOpts }));
          break;

        // 📷 디카/HUD (기존 코드 기반)
        case 'digicam':
          // 디카 가이드라인
          canvas.add(new fabric.Rect({ left: cx, top: cy, originX: 'center', originY: 'center', width: 1100, height: 600, fill: 'transparent', stroke: 'rgba(255,255,255,0.5)', strokeWidth: 2, ...commonTextOpts }));
          canvas.add(new fabric.Text('● REC', { left: 100, top: 80, fontFamily: 'Share Tech Mono', fontSize: 30, fill: '#f43f5e', ...commonTextOpts }));
          canvas.add(new fabric.Text('100% 🔋', { left: BASE_W - 220, top: 80, fontFamily: 'Share Tech Mono', fontSize: 24, fill: '#fff', ...commonTextOpts }));
          
          canvas.add(new fabric.Text(state.title, { left: cx, top: 150, originX: 'center', fontFamily: 'Noto Sans KR', fontSize: 60, fontWeight: '900', fill: '#fff', shadow: new fabric.Shadow({ color: '#000', blur: 10 }), ...commonTextOpts }));
          canvas.add(new fabric.Text(`${state.nameA} - ${state.nameB}`, { left: cx, top: 230, originX: 'center', fontFamily: 'Noto Sans KR', fontSize: 30, fill: '#a1a1aa', ...commonTextOpts }));
          
          canvas.add(new fabric.Text(`[ ${state.quote} ]`, { left: cx, top: 600, originX: 'center', fontFamily: 'Gowun Dodum', fontSize: 28, fill: '#fff', backgroundColor: 'rgba(0,0,0,0.5)', ...commonTextOpts }));
          break;

        // 💗 로맨스
        case 'romance':
          canvas.add(new fabric.Rect({ left: 0, top: 0, width: BASE_W, height: BASE_H, fill: 'rgba(0,0,0,0.3)', ...commonTextOpts })); // 살짝 어둡게
          canvas.add(new fabric.Text(state.title, { left: cx, top: cy - 100, originX: 'center', originY: 'center', fontFamily: 'Nanum Myeongjo', fontSize: 100, fontWeight: '800', fill: '#fff', ...commonTextOpts }));
          canvas.add(new fabric.Text(`${state.nameA} x ${state.nameB}`, { left: cx, top: cy + 20, originX: 'center', originY: 'center', fontFamily: 'Gowun Batang', fontSize: 35, fill: '#fda4af', ...commonTextOpts }));
          canvas.add(new fabric.Text(state.quote, { left: cx, top: BASE_H - 120, originX: 'center', fontFamily: 'Gowun Batang', fontSize: 24, fill: '#fff', ...commonTextOpts }));
          break;

        // 🏰 로판
        case 'royal':
          canvas.add(new fabric.Rect({ left: cx, top: cy, originX: 'center', originY: 'center', width: 1200, height: 640, fill: 'transparent', stroke: '#fbbf24', strokeWidth: 3, ...commonTextOpts }));
          canvas.add(new fabric.Rect({ left: cx, top: cy, originX: 'center', originY: 'center', width: 1180, height: 620, fill: 'transparent', stroke: '#fbbf24', strokeWidth: 1, ...commonTextOpts }));
          
          canvas.add(new fabric.Text(state.title, { left: cx, top: 150, originX: 'center', fontFamily: 'Cinzel', fontSize: 80, fontWeight: 'bold', fill: '#fbbf24', ...commonTextOpts }));
          canvas.add(new fabric.Text(`${state.nameA} ✦ ${state.nameB}`, { left: cx, top: 250, originX: 'center', fontFamily: 'Nanum Myeongjo', fontSize: 40, fill: '#fff', ...commonTextOpts }));
          canvas.add(new fabric.Text(`"${state.quote}"`, { left: cx, top: 580, originX: 'center', fontFamily: 'Nanum Myeongjo', fontSize: 30, fontStyle: 'italic', fill: '#d4d4d8', ...commonTextOpts }));
          break;

        // 📱 인스타그램
        case 'insta':
          // 인스타 UI (하얀색 박스)
          const instaBox = new fabric.Rect({ left: 80, top: cy, originY: 'center', width: 450, height: 600, fill: '#fff', rx: 20, ...commonTextOpts });
          canvas.add(instaBox);
          
          // 상단 프로필 영역
          canvas.add(new fabric.Circle({ left: 110, top: cy - 260, radius: 20, fill: '#e4e4e7', ...commonTextOpts }));
          canvas.add(new fabric.Text('dopa_official', { left: 160, top: cy - 250, fontFamily: 'Noto Sans KR', fontSize: 16, fontWeight: 'bold', fill: '#000', ...commonTextOpts }));
          
          // 타이포
          canvas.add(new fabric.Text(state.title, { left: 110, top: cy - 100, fontFamily: 'Noto Sans KR', fontSize: 50, fontWeight: '900', fill: '#000', ...commonTextOpts }));
          canvas.add(new fabric.Text(`♥ ${state.nameA} & ${state.nameB}`, { left: 110, top: cy, fontFamily: 'Noto Sans KR', fontSize: 20, fontWeight: 'bold', fill: '#e11d48', ...commonTextOpts }));
          
          // 대사 (본문 영역)
          canvas.add(new fabric.Text(state.quote, { left: 110, top: cy + 180, fontFamily: 'Gowun Batang', fontSize: 18, fill: '#333', ...commonTextOpts }));
          break;
      }
      
      canvas.renderAll();
    }

    // ==========================================
    // 배경 이미지 업로드 로직
    // ==========================================
    document.getElementById('imageUpload').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = f => {
        fabric.Image.fromURL(f.target.result, img => {
          // 화면에 꽉 차게 스케일링
          const targetScale = Math.max(BASE_W / img.width, BASE_H / img.height);
          img.set({
            scaleX: targetScale, scaleY: targetScale,
            left: BASE_W/2, top: BASE_H/2,
            originX: 'center', originY: 'center',
            hasControls: false, // 크기 조절 박스 숨김 (드래그 이동만 가능)
            hasBorders: false
          });
          state.bgImageObj = img;
          renderTemplate();
        });
      };
      reader.readAsDataURL(file);
    };

    // ==========================================
    // 이벤트 리스너 연결
    // ==========================================
    // 텍스트 입력
    const inputs = ['valTitle', 'valNameA', 'valNameB', 'valQuote'];
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        const key = id.replace('val', '');
        state[key.charAt(0).toLowerCase() + key.slice(1)] = e.target.value;
        renderTemplate();
      });
    });

    // 테마 버튼
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.theme = btn.dataset.theme;
        renderTemplate();
      });
    });

    // 다운로드
    document.getElementById('btnDownload').onclick = () => {
      canvas.discardActiveObject(); // 선택 해제
      canvas.renderAll();
      const link = document.createElement('a');
      link.download = `DOPA_CARD_${Date.now()}.png`;
      link.href = canvas.toDataURL({ format: 'png', quality: 1 });
      link.click();
    };

    // 초기 렌더링
    document.fonts.ready.then(() => renderTemplate());
    setTimeout(renderTemplate, 500);
  </script>
</body>
</html>
